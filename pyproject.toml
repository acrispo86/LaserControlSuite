[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lasercontrolsuite"
version = "0.1.0"
description = "Suite CAD/CAM desktop per il controllo di laser basati su GRBL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "LaserControlSuite Dev Team" }]
dependencies = [
    "PySide6>=6.6.0",
    "pyserial>=3.5",
    "ezdxf>=1.1.0",
    "svgpathtools>=1.6.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
trace = [
    "opencv-python-headless>=4.8",
    "scikit-image>=0.22",
]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "ruff>=0.4",
    "mypy>=1.8",
    # Test: includono anche trace per esercitare l'adapter
    "opencv-python-headless>=4.8",
    "scikit-image>=0.22",
]

[project.scripts]
lasercontrolsuite = "lasercontrolsuite.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"